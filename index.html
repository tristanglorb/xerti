<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xerti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:            #05060a;
    --surface:       #0b0d15;
    --surface-2:     #12141f;
    --line:          #1d2130;
    --text:          #e8ecf5;
    --text-dim:      #6b7690;
    --accent:        #3d8bff;
    --accent-dim:    #1b3868;
    --live:          #34d3ff;
    --danger:        #e2665f;
    --glow:          rgba(61,139,255,0.35);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(61,139,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(52,211,255,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .brand, .channel-name, .msg-user{
    font-family:'Space Grotesk', sans-serif;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- Auth screen ---------- */
  #auth-screen{
    height:100vh; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:28px;
  }
  .brand{
    font-size:34px; font-weight:700; letter-spacing:-0.02em;
    display:flex; align-items:center; gap:12px;
    text-shadow:0 0 24px rgba(61,139,255,0.35);
  }
  .brand .dot{
    width:10px; height:10px; border-radius:50%; background:var(--live);
    box-shadow:0 0 0 4px var(--glow);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 4px var(--glow); }
    50%{ box-shadow:0 0 0 8px rgba(52,211,255,0.08); }
  }
  .auth-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:32px; width:340px; display:flex; flex-direction:column; gap:14px;
    box-shadow:0 0 60px rgba(61,139,255,0.08), 0 20px 40px rgba(0,0,0,0.4);
  }
  .auth-tabs{ display:flex; gap:4px; background:var(--surface-2); border-radius:8px; padding:4px; }
  .auth-tab{
    flex:1; text-align:center; padding:8px; border-radius:6px; cursor:pointer;
    font-size:13px; color:var(--text-dim); font-weight:500; user-select:none;
  }
  .auth-tab.active{ background:var(--accent); color:#03040a; }
  input{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif;
    outline:none;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(61,139,255,0.15); }
  button{
    cursor:pointer; border:none; border-radius:8px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px;
  }
  .btn-primary{ background:var(--accent); color:#03040a; padding:11px; box-shadow:0 0 20px rgba(61,139,255,0.25); }
  .btn-primary:hover{ filter:brightness(1.1); box-shadow:0 0 26px rgba(61,139,255,0.4); }
  #auth-error{ color:var(--danger); font-size:13px; min-height:16px; }

  /* ---------- App shell ---------- */
  #app{ display:none; height:100vh; }
  .shell{ display:flex; height:100%; }

  .sidebar{
    width:250px; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  .sidebar-head{
    padding:18px 16px; border-bottom:1px solid var(--line);
  }
  .sidebar-scroll{ flex:1; overflow-y:auto; padding:12px 8px; }
  .section-label{
    font-size:11px; letter-spacing:0.08em; color:var(--text-dim);
    text-transform:uppercase; padding:10px 10px 6px; font-family:'IBM Plex Mono',monospace;
  }
  .channel-row{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:7px;
    cursor:pointer; color:var(--text-dim); font-size:14px;
  }
  .channel-row:hover{ background:var(--surface-2); }
  .channel-row.active{ background:var(--surface-2); color:var(--text); box-shadow:inset 2px 0 0 var(--accent), 0 0 18px rgba(61,139,255,0.08); }
  .channel-row.active .channel-name{ color:var(--accent); }
  .freq-dot{ width:6px; height:6px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .channel-row.active .freq-dot{ background:var(--live); }

  .new-group-btn{
    margin:6px 10px 2px; padding:8px; text-align:center; border:1px dashed var(--line);
    border-radius:7px; color:var(--text-dim); font-size:13px; cursor:pointer;
  }
  .new-group-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .sidebar-foot{
    padding:12px 16px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .me{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .avatar{
    width:26px; height:26px; border-radius:50%; background:var(--accent-dim);
    display:flex; align-items:center; justify-content:center; font-size:11px;
    color:var(--accent); font-weight:600; font-family:'Space Grotesk',sans-serif;
    flex-shrink:0;
  }
  .signout{ color:var(--text-dim); font-size:12px; cursor:pointer; }
  .signout:hover{ color:var(--danger); }

  /* ---------- Main chat panel ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat-head{
    padding:16px 24px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .chat-head .freq-dot.active{ background:var(--live); }
  .chat-head h2{ margin:0; font-size:17px; font-weight:600; }
  .chat-head .sub{ color:var(--text-dim); font-size:12px; margin-left:4px; }

  .messages{ flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:2px; }
  .msg-row{
    display:flex; gap:12px; padding:7px 8px; border-radius:8px; border-left:2px solid transparent;
  }
  .msg-row:hover{ background:var(--surface); }
  .msg-avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600;
    font-family:'Space Grotesk',sans-serif;
  }
  .msg-body{ min-width:0; }
  .msg-meta{ display:flex; align-items:baseline; gap:8px; }
  .msg-user{ font-size:13.5px; font-weight:600; }
  .msg-time{ font-size:11px; color:var(--text-dim); }
  .msg-text{ font-size:14px; line-height:1.5; color:var(--text); word-wrap:break-word; white-space:pre-wrap; }

  .composer{
    padding:16px 24px 22px; border-top:1px solid var(--line); display:flex; gap:10px;
  }
  .composer input{
    flex:1; padding:13px 14px; border-radius:10px; font-size:14px;
  }
  .composer button{ padding:0 22px; border-radius:10px; }

  .empty-state{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:13px; flex-direction:column; gap:8px;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,14,0.6);
    display:none; align-items:center; justify-content:center; z-index:10;
  }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:26px; width:360px; display:flex; flex-direction:column; gap:12px;
  }
  .modal h3{ margin:0 0 4px; font-size:16px; }
  .modal .hint{ color:var(--text-dim); font-size:12px; margin-top:-6px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  .btn-ghost{ background:transparent; color:var(--text-dim); padding:9px 14px; }
  .btn-ghost:hover{ color:var(--text); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen">
  <div class="brand"><span class="dot"></span> XERTI</div>
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" data-mode="signin">Sign in</div>
      <div class="auth-tab" data-mode="signup">Sign up</div>
    </div>
    <input id="auth-username" placeholder="Username" style="display:none" />
    <input id="auth-email" placeholder="Email" type="email" />
    <input id="auth-password" placeholder="Password" type="password" />
    <button class="btn-primary" id="auth-submit">Sign in</button>
    <div id="auth-error"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="sidebar-head brand" style="font-size:18px; display:flex; gap:8px; align-items:center;">
        <span class="dot" style="width:8px;height:8px;"></span> XERTI
      </div>
      <div class="sidebar-scroll">
        <div class="section-label">Lobby</div>
        <div class="channel-row active" id="lobby-row" data-type="public">
          <span class="freq-dot"></span>
          <span class="channel-name">General</span>
        </div>

        <div class="section-label">Private groups</div>
        <div id="group-list"></div>
        <div class="new-group-btn" id="new-group-btn">+ New group</div>
      </div>
      <div class="sidebar-foot">
        <div class="me">
          <div class="avatar" id="me-avatar">?</div>
          <span id="me-username" class="mono"></span>
        </div>
        <span class="signout" id="signout-btn">sign out</span>
      </div>
    </div>

    <div class="main">
      <div class="chat-head">
        <span class="freq-dot active"></span>
        <h2 id="chat-title">General</h2>
        <span class="sub" id="chat-sub">open to everyone</span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="composer-input" placeholder="Say something…" autocomplete="off" />
        <button class="btn-primary" id="composer-send">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= NEW GROUP MODAL ================= -->
<div class="modal-backdrop" id="group-modal-backdrop">
  <div class="modal">
    <h3>New private group</h3>
    <input id="group-name-input" placeholder="Group name" />
    <input id="group-invite-input" placeholder="Invite username (optional)" />
    <div class="hint">You can invite more people later — just ask them to be added by username.</div>
    <div class="modal-actions">
      <button class="btn-ghost" id="group-cancel">Cancel</button>
      <button class="btn-primary" id="group-create">Create</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIG — replace with your own Supabase project values.
// The anon key below is SAFE to expose publicly: it has no
// power beyond what your RLS policies (schema.sql) allow.
// ============================================================
const SUPABASE_URL = 'https://kfczdvhdloqdnpezuvqk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmY3pkdmhkbG9xZG5wZXp1dnFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0Nzc5MzQsImV4cCI6MjA5OTA1MzkzNH0.RtN95OjMzNQI5eFiqKYhio_kpstSFX2ZXGRS5dqbyQU';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let activeChannel = { type: 'public', id: null, name: 'General' };
let messageSub = null;
let myGroups = [];

// ---------- helpers ----------
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function colorFor(str){
  let hash = 0;
  for (const c of str) hash = c.charCodeAt(0) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 60%)`;
}
function initials(name){ return (name || '?').slice(0,2).toUpperCase(); }
function timeFmt(ts){
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

// ---------- auth screen wiring ----------
let authMode = 'signin';
$$('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    authMode = tab.dataset.mode;
    $('#auth-submit').textContent = authMode === 'signin' ? 'Sign in' : 'Sign up';
    $('#auth-username').style.display = authMode === 'signup' ? 'block' : 'none';
    $('#auth-error').textContent = '';
  });
});

$('#auth-submit').addEventListener('click', async () => {
  const email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  const username = $('#auth-username').value.trim();
  $('#auth-error').textContent = '';

  if (!email || !password) {
    $('#auth-error').textContent = 'Enter an email and password.';
    return;
  }

  if (authMode === 'signup') {
    if (username.length < 3) {
      $('#auth-error').textContent = 'Username must be at least 3 characters.';
      return;
    }
    const { error } = await sb.auth.signUp({
      email, password,
      options: { data: { username } }
    });
    if (error) { $('#auth-error').textContent = error.message; return; }
    $('#auth-error').style.color = 'var(--live)';
    $('#auth-error').textContent = 'Check your email to confirm, then sign in.';
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { $('#auth-error').textContent = error.message; return; }
    await boot();
  }
});

$('#signout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

// ---------- boot after login ----------
async function boot(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  currentUser = user;

  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = profile;

  $('#auth-screen').style.display = 'none';
  $('#app').style.display = 'block';
  $('#me-username').textContent = profile?.username || 'you';
  $('#me-avatar').textContent = initials(profile?.username);
  $('#me-avatar').style.background = colorFor(profile?.username || 'you');
  $('#me-avatar').style.color = '#14151c';

  await loadGroups();
  await selectChannel({ type: 'public', id: null, name: 'General' });
}

// ---------- groups ----------
async function loadGroups(){
  const { data: memberships } = await sb
    .from('group_members')
    .select('group_id, groups(id, name)')
    .eq('user_id', currentUser.id);

  myGroups = (memberships || []).map(m => m.groups).filter(Boolean);
  const list = $('#group-list');
  list.innerHTML = '';
  myGroups.forEach(g => {
    const row = document.createElement('div');
    row.className = 'channel-row';
    row.dataset.type = 'group';
    row.dataset.id = g.id;
    row.innerHTML = `<span class="freq-dot"></span><span class="channel-name">#${g.name}</span>`;
    row.addEventListener('click', () => selectChannel({ type: 'group', id: g.id, name: g.name }));
    list.appendChild(row);
  });
}

$('#new-group-btn').addEventListener('click', () => {
  $('#group-modal-backdrop').style.display = 'flex';
});
$('#group-cancel').addEventListener('click', () => {
  $('#group-modal-backdrop').style.display = 'none';
});
$('#group-create').addEventListener('click', async () => {
  const name = $('#group-name-input').value.trim();
  const inviteUsername = $('#group-invite-input').value.trim();
  if (!name) return;

  const { data: group, error } = await sb
    .from('groups')
    .insert({ name, created_by: currentUser.id })
    .select()
    .single();
  if (error) { alert(error.message); return; }

  // add self as owner
  await sb.from('group_members').insert({ group_id: group.id, user_id: currentUser.id, role: 'owner' });

  // optional invite
  if (inviteUsername) {
    const { data: invitee } = await sb.from('profiles').select('id').eq('username', inviteUsername).single();
    if (invitee) {
      await sb.from('group_members').insert({ group_id: group.id, user_id: invitee.id, role: 'member' });
    } else {
      alert(`Group created, but no user named "${inviteUsername}" was found to invite.`);
    }
  }

  $('#group-modal-backdrop').style.display = 'none';
  $('#group-name-input').value = '';
  $('#group-invite-input').value = '';
  await loadGroups();
  await selectChannel({ type: 'group', id: group.id, name: group.name });
});

// ---------- channel switching ----------
async function selectChannel(channel){
  activeChannel = channel;

  $$('.channel-row').forEach(r => r.classList.remove('active'));
  if (channel.type === 'public') {
    $('#lobby-row').classList.add('active');
  } else {
    const row = [...$$('.channel-row')].find(r => r.dataset.type === 'group' && r.dataset.id == channel.id);
    if (row) row.classList.add('active');
  }

  $('#chat-title').textContent = channel.type === 'public' ? 'General' : `#${channel.name}`;
  $('#chat-sub').textContent = channel.type === 'public' ? 'open to everyone' : 'private group';

  await loadMessages();
  subscribeToChannel();
}

// ---------- messages ----------
async function loadMessages(){
  const box = $('#messages');
  box.innerHTML = '';

  let query;
  if (activeChannel.type === 'public') {
    query = sb.from('messages').select('*, profiles(username)').order('created_at', { ascending: true }).limit(200);
  } else {
    query = sb.from('group_messages').select('*, profiles(username)')
      .eq('group_id', activeChannel.id).order('created_at', { ascending: true }).limit(200);
  }

  const { data, error } = await query;
  if (error) { console.error(error); return; }
  if (!data || data.length === 0) {
    box.innerHTML = `<div class="empty-state">No messages yet — say hello.</div>`;
    return;
  }
  data.forEach(renderMessage);
  box.scrollTop = box.scrollHeight;
}

function renderMessage(msg){
  const box = $('#messages');
  if (box.querySelector('.empty-state')) box.innerHTML = '';

  const username = msg.profiles?.username || 'unknown';
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-avatar" style="background:${colorFor(username)}22; color:${colorFor(username)}">${initials(username)}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-user" style="color:${colorFor(username)}">${escapeHtml(username)}</span>
        <span class="msg-time mono">${timeFmt(msg.created_at)}</span>
      </div>
      <div class="msg-text">${escapeHtml(msg.content)}</div>
    </div>
  `;
  box.appendChild(row);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function sendMessage(){
  const input = $('#composer-input');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';

  if (activeChannel.type === 'public') {
    await sb.from('messages').insert({ user_id: currentUser.id, content });
  } else {
    await sb.from('group_messages').insert({ group_id: activeChannel.id, user_id: currentUser.id, content });
  }
}

$('#composer-send').addEventListener('click', sendMessage);
$('#composer-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// ---------- realtime ----------
function subscribeToChannel(){
  if (messageSub) sb.removeChannel(messageSub);

  const table = activeChannel.type === 'public' ? 'messages' : 'group_messages';
  const filter = activeChannel.type === 'public' ? undefined : `group_id=eq.${activeChannel.id}`;

  messageSub = sb.channel(`room-${activeChannel.type}-${activeChannel.id || 'public'}`)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table, filter },
      async (payload) => {
        const { data: profile } = await sb.from('profiles').select('username').eq('id', payload.new.user_id).single();
        renderMessage({ ...payload.new, profiles: profile });
        const box = $('#messages');
        box.scrollTop = box.scrollHeight;
      }
    )
    .subscribe();
}

// ---------- init ----------
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await boot();
})();
</script>
</body>
</html>
